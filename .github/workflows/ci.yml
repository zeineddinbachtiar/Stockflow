name: StockFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, Tests and Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: stockflow_test_db
      DB_USER: stockflow_app
      DB_PASSWORD: stockflow_ci_password

      JWT_SECRET: stockflow-ci-only-secret-not-used-in-any-real-environment-0123456789abcdef

      SEED_ADMIN_PASSWORD: ci-admin-password-123
      SEED_WAREHOUSE_PASSWORD: ci-warehouse-password-123
      SEED_SALES_PASSWORD: ci-sales-password-123

      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create isolated test database role
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE stockflow_app WITH LOGIN PASSWORD 'stockflow_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION;"

      - name: Create test database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql --username=postgres --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE stockflow_test_db OWNER stockflow_app;"

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check test TypeScript
        run: npm run test:typecheck

      - name: Check application TypeScript
        run: npm run typecheck

      - name: Build application
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run integration tests
        run: npm test

      - name: Validate Docker Compose
        env:
          POSTGRES_ADMIN_PASSWORD: ci-postgres-admin-password
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t stockflow-api:ci .
